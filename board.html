<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ON DASHBOARD</title>
<style>
@font-face{font-family:"Spoqa Han Sans Neo";src:url("fonts/SpoqaHanSansNeo-Light.woff2") format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:"Spoqa Han Sans Neo";src:url("fonts/SpoqaHanSansNeo-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Spoqa Han Sans Neo";src:url("fonts/SpoqaHanSansNeo-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Spoqa Han Sans Neo";src:url("fonts/SpoqaHanSansNeo-Bold.woff2") format("woff2");font-weight:700;font-display:swap}

:root{
  color-scheme:light;
  --bg:#f1f4f4; --panel:#ffffff; --panel-line:#dfe5e5;
  --ink:#262626; --ink-2:#595959; --ink-3:#7d8585;
  --teal:#319f9c; --teal-d:#1f6f6d; --teal-text:#217d7a; --teal-soft:#a1e3e1; --teal-tint:#f3fbfb;
  --blk:#404040; --blk-ink:#ffffff; --ban:#404040; --ban-ink:#ffffff;
  --th:#319f9c; --th-ink:#ffffff;
  --row-a:#ffffff; --row-b:#f3f3f3; --rule:#d9d9d9; --tot:#e8e8e8;
  --emph-bg:#f3fbfb; --emph-ink:#319f9c;
  --good:#36b0ad; --mid:#a1e3e1; --bad:#c00000; --off:#9a9a9a;
  --bar-dark:#404040; --track:#e8e8e8;
  --b1:#1f6f6d; --b2:#319f9c; --b3:#a1e3e1; --b4:#8c8c8c; --b5:#d9d9d9;
  --own-a:#319f9c; --own-a-ink:#fff; --own-d:#404040; --own-d-ink:#fff; --own-c:#d9d9d9; --own-c-ink:#262626;
  --font:"Spoqa Han Sans Neo","Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f1313; --panel:#171c1c; --panel-line:#2a3232;
    --ink:#e6ebeb; --ink-2:#b3bdbd; --ink-3:#8a9696;
    --teal:#3db2af; --teal-d:#5fd0cd; --teal-text:#5fd0cd; --teal-soft:#2c6563; --teal-tint:#1a2a2a;
    --blk:#cfd6d6; --blk-ink:#161a1a; --ban:#263030; --ban-ink:#e6ebeb;
    --th:#2b8b88; --th-ink:#ffffff;
    --row-a:#171c1c; --row-b:#1e2424; --rule:#313939; --tot:#2a3232;
    --emph-bg:#1a2a2a; --emph-ink:#5fd0cd;
    --good:#36b0ad; --mid:#a1e3e1; --bad:#f26b6b; --off:#7d8888;
    --bar-dark:#cfd6d6; --track:#2a3232;
    --b1:#5fd0cd; --b2:#3db2af; --b3:#2c6563; --b4:#7d8888; --b5:#3a4343;
    --own-a:#3db2af; --own-a-ink:#0f1313; --own-d:#cfd6d6; --own-d-ink:#161a1a; --own-c:#3a4343; --own-c-ink:#e6ebeb;
  }
}

html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px}
#dash{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg)}
body.editing #dash{width:calc(100% - min(760px,100vw))}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:13px;pointer-events:none}
#fab{position:fixed;right:18px;bottom:18px;z-index:40;box-shadow:0 4px 14px rgba(0,0,0,.25);padding:7px 16px!important;font-size:13px!important}
body.editing #fab{display:none}
.empty{color:var(--ink-3);font-size:12px;padding:14px 4px;text-align:center}
.own{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:2px}
.own.o-a{background:var(--own-a);color:var(--own-a-ink)}
.ed-b .na{color:var(--ink-3);font-size:11.5px;border:1px dashed var(--panel-line);padding:6px 8px;margin:4px 0 10px}
.drop{border:2px dashed var(--panel-line);border-radius:3px;padding:18px;text-align:center;color:var(--ink-2);margin:6px 0 12px;cursor:pointer}
.drop.on{border-color:var(--teal);background:var(--teal-tint)}
.hist{width:100%;border-collapse:collapse;font-size:12px}
.hist td{padding:4px 4px;border-bottom:1px solid var(--panel-line);vertical-align:top}
.hist td.t{white-space:nowrap;color:var(--ink-3)}
/* ---------- editor ---------- */
.edbtn[hidden]{display:none!important}
.edbtn{font:inherit; font-size:12px; font-weight:700; border:1px solid var(--teal); background:var(--teal); color:#fff; padding:3px 12px; border-radius:2px; cursor:pointer}
.edbtn:hover{filter:brightness(1.08)}
body.editing .app{margin-right:min(760px,100vw)}
#ed{position:fixed; top:0; right:0; bottom:0; width:min(760px,100vw); background:var(--panel); border-left:1px solid var(--panel-line); box-shadow:-6px 0 24px rgba(0,0,0,.18); z-index:50; display:flex; flex-direction:column; font-size:12.5px}
#ed[hidden]{display:none!important}
.ed-h{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:12px 14px; border-bottom:1px solid var(--panel-line)}
.ed-h h2{font-size:15px; margin:0 auto 0 0}
.ed-h button,.ed-f button,.ed-b .add,.ed-b .del{font:inherit; font-size:12px; border:1px solid var(--panel-line); background:var(--panel); color:var(--ink); padding:4px 10px; border-radius:2px; cursor:pointer}
.ed-h .pri{background:var(--teal); border-color:var(--teal); color:#fff; font-weight:700}
.ed-h .pri:disabled{opacity:.5; cursor:default}
.ed-st{font-size:11.5px; color:var(--ink-3); width:100%}
.ed-st.err{color:var(--bad)} .ed-st.ok{color:var(--teal-text)}
.ed-tabs{display:flex; gap:2px; padding:0 10px; border-bottom:1px solid var(--panel-line); overflow-x:auto}
.ed-tabs button{font:inherit; font-size:12.5px; background:none; border:0; border-bottom:2px solid transparent; padding:8px 10px; color:var(--ink-2); cursor:pointer; white-space:nowrap}
.ed-tabs button[aria-selected="true"]{color:var(--ink); font-weight:700; border-bottom-color:var(--teal)}
.ed-b{flex:1; overflow:auto; padding:12px 14px 40px}
.ed-b h4{font-size:12.5px; margin:16px 0 6px; color:var(--teal-text)}
.ed-b h4:first-child{margin-top:0}
.ed-b .hint{color:var(--ink-3); font-size:11.5px; margin:2px 0 8px}
.ed-b input,.ed-b select,.ed-b textarea{font:inherit; font-size:12px; color:var(--ink); background:var(--row-a); border:1px solid var(--panel-line); border-radius:2px; padding:3px 6px; width:100%; min-width:0; box-sizing:border-box}
.ed-b textarea{min-height:64px; resize:vertical}
.ed-b input[type=checkbox]{width:auto}
.ed-b input:focus,.ed-b select:focus,.ed-b textarea:focus{outline:2px solid var(--teal-soft); border-color:var(--teal)}
.ed-b label.f{display:block; margin-bottom:8px} .ed-b label.f span{display:block; font-size:11.5px; color:var(--ink-3); margin-bottom:2px}
.ed-g{width:100%; border-collapse:collapse; margin-bottom:6px}
.ed-g th,.ed-g td,.ed-g td:first-child,.ed-g th:first-child,.ed-g tbody tr:nth-child(even) td{background:none!important; color:var(--ink)!important; border:0; font-weight:400}
.ed-g th,.ed-g th:first-child{font-size:11px; font-weight:500; color:var(--ink-3)!important; text-align:left; padding:2px 3px; white-space:nowrap}
.ed-g td{padding:2px 3px; vertical-align:top; white-space:normal}
.ed-g td.x{width:28px}
.ed-b .del{padding:2px 7px; color:var(--bad)}
.ed-b .btn{font:inherit; font-size:12px; border:1px solid var(--panel-line); background:var(--panel); color:var(--ink); padding:3px 9px; border-radius:2px; cursor:pointer}
.ed-b .add{border-style:dashed; color:var(--teal-text); margin:2px 0 6px}
.ed-it{border:1px solid var(--panel-line); border-left:3px solid var(--panel-line); border-radius:2px; padding:6px 8px; margin-bottom:6px; background:var(--row-a)}
.ed-it.k{border-left-color:var(--teal)} .ed-it.risk{border-left-color:var(--bad)}
.ed-row{display:grid; grid-template-columns:auto 96px 100px 130px 84px 1fr auto; gap:5px; align-items:center}
.ed-row label{display:flex; gap:3px; align-items:center; white-space:nowrap; font-size:11.5px}
.ed-it .tx{margin:5px 0}
.ed-chips{display:flex; flex-wrap:wrap; gap:3px; align-items:center; font-size:11px; color:var(--ink-3)}
.ed-chips b{font-weight:500; margin:0 2px 0 6px} .ed-chips b:first-child{margin-left:0}
.chip{font:inherit; font-size:11px; border:1px solid var(--panel-line); background:var(--panel); color:var(--ink-2); padding:1px 7px; border-radius:10px; cursor:pointer}
.chip[aria-pressed="true"]{background:var(--teal); border-color:var(--teal); color:#fff}
.ed-flt{display:flex; gap:6px; margin-bottom:8px; position:sticky; top:-12px; background:var(--panel); padding:6px 0; z-index:1}
.ed-flt input{flex:1} .ed-flt select{width:auto}
.ed-card{border:1px solid var(--panel-line); border-radius:2px; padding:8px 10px; margin-bottom:10px}
.ed-card .hd{display:flex; align-items:center; gap:8px; margin-bottom:6px} .ed-card .hd b{font-size:13px; margin-right:auto}
.ed-f4{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:4px 8px}
.ed-f4 label.f{margin-bottom:2px}
.ed-f{padding:8px 14px; border-top:1px solid var(--panel-line); display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:11.5px; color:var(--ink-3)}
.ed-f .sp{margin-left:auto}
@media (max-width:1100px){body.editing .app{margin-right:0}}
@media (max-width:640px){.ed-row{grid-template-columns:auto 1fr 1fr; } .ed-f4{grid-template-columns:repeat(2,minmax(0,1fr))}}

</style></head><body>

<script>
(function(){

/* =================== source parsing (Claude HTML → editable values) =================== */

    tryR("dTitle",function(){var a=strsAt(s,dst.p+1,3);if(!a)return null;return {s:a[1].s,e:a[2].e,val:{title:a[1].v,meta:a[2].v},w:function(v){return JSON.stringify(v.title)+","+JSON.stringify(v.meta);}};});
    tryR("dStats",function(){var i=s.indexOf('<div class="stats">',dst.s);if(i<0||i>dst.e)return null;var q=s.lastIndexOf("'",i);var qe=strEnd(s,q);var inner0=i+'<div class="stats">'.length,inner1=qe-1-"</div>".length;
      if(s.slice(inner1,qe-1)!=="</div>")return null;var body=s.slice(inner0,inner1);var re=/<div class="stat"><div class="l">([\s\S]*?)<\/div><div class="v">([\s\S]*?)<\/div><div class="s">([\s\S]*?)<\/div><\/div>/g,m,out=[];

    tryR("dHead",function(){var t=tblParts(s,dst);if(!t)return null;var v=evalLit(s.slice(t.h.s,t.h.e));return {s:t.h.s,e:t.h.e,val:v,w:function(v){return ser(v);}};});
    tryR("mats",function(){var t=tblParts(s,dst);if(!t)return null;var v=evalLit(s.slice(t.r.s,t.r.e));if(!Array.isArray(v))return null;return {s:t.r.s,e:t.r.e,val:v,w:function(v){return "[\n      "+v.map(function(r){return ser(r);}).join(",\n      ")+"]";}};});

  return '<table class="hist">'+HIST.map(function(c){return '<tr><td class="t">'+stamp(new Date(c.commit.author.date))+'</td><td>'+esc(c.commit.message.split("\n")[0])+'</td></tr>';}).join("")+'</table>';}
async function loadHist(){try{var r=await fetch("https://api.github.com/repos/"+REPO+"/commits?path="+FILE+"&per_page=15");HIST=r.ok?await r.json():[];}catch(_){HIST=[];}var e=$("hist");if(e)e.innerHTML=histHtml();}
var SECF={bn:secBn,it:secIt,sh:secSh,inv:secInv,pr:secPr,ed:secEd,ver:secVer};
function secList(){return SECS.concat([["ver","버전 · 업로드"]]).concat(isAdmin()?[["ed","편집자 관리"]]:[]);}
function edShell(){
  $("ed").innerHTML='<div class="ed-h"><h2>자료 편집</h2><button type="button" data-edx="close">닫기</button><button type="button" data-edx="revert">변경 취소</button><button type="button" class="pri" data-edx="save" id="edSave">저장</button><div class="ed-st" id="edSt"></div></div>'
   +'<div class="ed-tabs" role="tablist">'+secList().map(function(s){return '<button type="button" role="tab" data-es="'+s[0]+'" aria-selected="'+(ED.sec===s[0])+'">'+s[1]+'</button>';}).join("")+'</div>'
   +'<div class="ed-b" id="edB"></div><div class="ed-f"><span id="edTk"></span>'+(isAdmin()?'':'<button type="button" data-edx="forget">이 브라우저 편집 해제</button>')+'<span class="sp">입력하면 왼쪽에 바로 미리 보이고, 저장해야 모두에게 반영돼요.</span></div>';
  edBody();edStatus();if(ED.dirty)edSay("저장하지 않은 변경이 있습니다.");}
function edBody(){if(ED.sec==="ed"&&!isAdmin())ED.sec="bn";$("edB").innerHTML=SECF[ED.sec]();$("edB").scrollTop=0;if(ED.sec==="ver")wireDrop();}
function edSay(m,c){var e=$("edSt");if(e){e.textContent=m||"";e.className="ed-st "+(c||"");}}
function edStatus(){var k=$("edTk");if(k)k.textContent=isAdmin()?("관리자"+(ls(NK)?" · "+ls(NK):"")):(ME?"편집자 · "+ME.n:"편집 권한 없음");var s=$("edSave");if(s)s.textContent=ED.dirty?"저장 ●":"저장";}
function dirty(){if(!ED.dirty){ED.dirty=true;edStatus();edSay("저장하지 않은 변경이 있습니다.");}preview();}
function onField(e){var el=e.target;if(!el.dataset||el.dataset.p==null)return;
  var p=el.dataset.p,i=el.dataset.i,k=el.dataset.k,t=el.dataset.t,v;
  if(t==="chk")v=el.checked?1:0;else if(t==="num")v=el.value===""?0:(+String(el.value).replace(/,/g,"")||0);else v=el.value;
  if(i===""&&k===""){if(DATA[p]===v)return;DATA[p]=v;dirty();return;}
  var row=i===""?DATA[p]:getP(p)[+i];
  if(p==="inv"&&k==="paid"&&!v)v=null;
  if(getK(row,k)===v)return;setK(row,k,v);
  if(p==="items"){var card=el.closest(".ed-it");
    if(k==="a"){row.t=row.t||[];var tt=A2T[v];if(tt&&row.t.indexOf(tt)<0){row.t.push(tt);var c=card&&card.querySelector('.chip[data-k="t"][data-val="'+tt+'"]');if(c)c.setAttribute("aria-pressed","true");}}
    if(card){card.classList.toggle("k",!!row.k);card.classList.toggle("risk",row.s==="risk");}}
  dirty();}

async function fetchLatest(){var r=await gh(FILE,"GET");if(!r.ok)throw new Error("최신본 확인 실패 ("+r.status+")");var j=await r.json();return {sha:j.sha,src:unb64(j.content)};}
async function save(){
  var tk=await getTok();
  if(!tk){edSay(ls(KK)?"편집 권한이 없거나 해제됐어요. 관리자에게 편집 링크를 받아 주세요.":"편집 권한이 없어요.","err");return;}
  if(!isAdmin()){try{var er=await fetch(API+"editors.json?ref=main&_="+Date.now(),{headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+tk},cache:"no-store"});var ej=er.ok?JSON.parse(unb64((await er.json()).content)):{editors:[]};
    if(!(ej.editors||[]).some(function(x){return ME&&x.id===ME.id;})){ME=null;edSay("편집 권한이 해제됐어요. 관리자에게 문의해 주세요.","err");return;}}catch(_){edSay("권한 확인에 실패했어요.","err");return;}}
  var nm=myName();if(isAdmin()&&!nm){nm=prompt("이름을 입력해 주세요. 수정 기록에 남습니다.","");if(nm===null)return;nm=nm.trim();if(nm)lset(NK,nm);}
  var btn=$("edSave");btn.disabled=true;edSay("저장 중…");
  try{var L=await fetchLatest();
    if(L.sha!==SHA){btn.disabled=false;
      if(!confirm("편집을 시작한 뒤 새 버전(클로드 업로드 또는 다른 사람 저장)이 올라왔어요.\n\n[확인] 새 버전을 불러오기 (지금 고친 내용은 버려지니 다시 입력해 주세요)\n[취소] 그대로 두기"))return;
      SRC=L.src;SHA=L.sha;parse(SRC);ED.dirty=false;show(SRC);edShell();edSay("새 버전을 불러왔어요. 다시 고친 뒤 저장해 주세요.","ok");return;}
    var out=build();
    var w=await gh(FILE,"PUT",{message:"웹 수정 · "+(nm||"이름 없음")+" · "+stamp(),content:b64(out),sha:SHA,branch:"main"});
    if(!w.ok){edSay("저장 실패 ("+w.status+")","err");return;}
    var j=await w.json();SHA=j.content.sha;SRC=out;parse(SRC);ED.dirty=false;HIST=null;
    try{sessionStorage.setItem(SC,JSON.stringify({sha:SHA,src:SRC,at:Date.now()}));}catch(_){}
    edShell();edSay("저장 완료 · 다른 사람 화면에는 1~2분 안에 반영됩니다.","ok");
  }catch(err){edSay("저장 중 오류: "+err.message,"err");}finally{var b=$("edSave");if(b)b.disabled=false;}}
async function uploadFile(file){
  if(!isAdmin()&&!ME){edSay("편집 권한이 없어요.","err");return;}
  var text=await file.text();
  if(!/var\s+ITEMS\s*=/.test(text)||!/<script/i.test(text)){edSay("대시보드 HTML이 아닌 것 같아요: "+file.name,"err");return;}
  var webEd=0;try{var r=await fetch("https://api.github.com/repos/"+REPO+"/commits?path="+FILE+"&per_page=20");var cs=r.ok?await r.json():[];for(var i=0;i<cs.length;i++){if(/^웹 수정/.test(cs[i].commit.message))webEd++;else break;}}catch(_){}
  if(webEd&&!confirm("마지막 클로드 버전 이후 웹에서 고친 기록이 "+webEd+"건 있어요.\n이 파일에 그 내용이 없다면 사라집니다. 그래도 올릴까요?"))return;
  if(ED.dirty&&!confirm("저장하지 않은 웹 수정이 있어요. 버리고 새 버전을 올릴까요?"))return;
  edSay("올리는 중…");
  try{var L=await fetchLatest();var nm=myName();
    var w=await gh(FILE,"PUT",{message:"클로드 버전 업로드 · "+file.name+(nm?" · "+nm:""),content:b64(text),sha:L.sha,branch:"main"});
    if(!w.ok){edSay("업로드 실패 ("+w.status+")","err");return;}
    var j=await w.json();SHA=j.content.sha;SRC=text;parse(SRC);ED.dirty=false;HIST=null;show(SRC);
    try{sessionStorage.setItem(SC,JSON.stringify({sha:SHA,src:SRC,at:Date.now()}));}catch(_){}
    edShell();edSay("새 버전을 올렸어요 · 1~2분 안에 모두에게 반영됩니다.","ok");}catch(e){edSay("업로드 오류: "+e.message,"err");}}
function wireDrop(){var d=$("drop"),f=$("upf");if(!d)return;d.onclick=function(){f.click();};f.onchange=function(){if(f.files[0])uploadFile(f.files[0]);};
  d.ondragover=function(e){e.preventDefault();d.classList.add("on");};d.ondragleave=function(){d.classList.remove("on");};
  d.ondrop=function(e){e.preventDefault();d.classList.remove("on");if(e.dataTransfer.files[0])uploadFile(e.dataTransfer.files[0]);};}

/* editors.json admin */
async function makeEntry(name,id,adm){var tok=ls(TK),secret=b64url(crypto.getRandomValues(new Uint8Array(18)));var k=await aesKey(secret,"encrypt"),iv=crypto.getRandomValues(new Uint8Array(12));
  var ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},k,new TextEncoder().encode(tok)));
  return {e:{id:id||b64url(crypto.getRandomValues(new Uint8Array(6))),n:name,at:today(),adm:adm?1:0,iv:toB64(iv),ct:toB64(ct)},link:location.origin+location.pathname+"#edit="+secret};}
async function saveEditors(list,msg){var g=await gh("editors.json","GET"),sha=null;if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error("GitHub 확인 실패 ("+g.status+")");
  var body={message:msg,content:b64(JSON.stringify({v:1,editors:list},null,1)),branch:"main"};if(sha)body.sha=sha;var w=await gh("editors.json","PUT",body);if(!w.ok)throw new Error("저장 실패 ("+w.status+")");EDS=list;}
async function edAdmin(act,arg){try{var L=adminLinks();
  if(act==="add"){var nm=($("edNewName").value||"").trim();if(!nm){edSay("이름을 입력해 주세요.","err");return;}edSay("링크 만드는 중…");var r=await makeEntry(nm,null,arg==="adm");
    await saveEditors(EDS.concat([r.e]),"편집자 추가 · "+nm);L[r.e.id]=r.link;lset(LK,JSON.stringify(L));edBody();edSay("‘"+nm+"’ 링크를 만들었어요. ‘링크 복사’로 전달하세요. 1~2분 뒤부터 작동합니다.","ok");}
  else if(act==="rekey"){var old=EDS.filter(function(x){return x.id===arg;})[0];if(!old||!confirm("‘"+old.n+"’의 링크를 새로 만들까요? 기존 링크는 막힙니다."))return;
    var r2=await makeEntry(old.n,old.id,old.adm);await saveEditors(EDS.map(function(x){return x.id===arg?r2.e:x;}),"편집 링크 재발급 · "+old.n);L[arg]=r2.link;lset(LK,JSON.stringify(L));edBody();edSay("‘"+old.n+"’ 새 링크를 만들었어요.","ok");}
  else if(act==="revoke"){var o=EDS.filter(function(x){return x.id===arg;})[0];if(!o||!confirm("‘"+o.n+"’의 편집 권한을 끌까요?"))return;
    await saveEditors(EDS.filter(function(x){return x.id!==arg;}),"편집자 제거 · "+o.n);delete L[arg];lset(LK,JSON.stringify(L));edBody();edSay("‘"+o.n+"’의 편집 권한을 껐어요.","ok");}
  }catch(err){edSay(err.message,"err");}}

async function openEd(){document.body.classList.add("editing");$("ed").hidden=false;edShell();
  if(!ED.dirty){edSay("최신 자료 확인 중…");try{var L=await fetchLatest();if(L.sha!==SHA||L.src!==SRC){SRC=L.src;SHA=L.sha;parse(SRC);show(SRC);edBody();}else if(!SHA)SHA=L.sha;edSay("");}catch(e){edSay(e.message,"err");}}}
function closeEd(){document.body.classList.remove("editing");$("ed").hidden=true;}
$("fab").addEventListener("click",openEd);
$("ed").addEventListener("input",function(e){if(e.target.id==="edQ"){ED.q=e.target.value;$("edList").innerHTML=itemList();return;}onField(e);});
$("ed").addEventListener("change",function(e){if(e.target.id==="edFs"){ED.fs=e.target.value;$("edList").innerHTML=itemList();return;}if(e.target.id==="edFo"){ED.fo=e.target.value;$("edList").innerHTML=itemList();return;}onField(e);});
$("ed").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
  if(b.dataset.es){ED.sec=b.dataset.es;edShell();return;}
  var x=b.dataset.edx;
  if(x==="close"){closeEd();return;}
  if(x==="save"){save();return;}
  if(x==="forget"){if(!confirm("이 브라우저에서 편집 권한을 지울까요?"))return;lset(KK,null);ME=null;ED.dirty=false;parse(SRC);show(SRC);closeEd();$("fab").hidden=!canEdit();return;}
  if(x==="revert"){if(ED.dirty&&!confirm("저장하지 않은 변경을 모두 버릴까요?"))return;parse(SRC);ED.dirty=false;show(SRC);edShell();edSay("되돌렸어요.","ok");return;}
  if(x==="addEditor"){edAdmin("add");return;}
  if(x==="addAdmin"){if(!($("edNewName").value||"").trim())$("edNewName").value=(ls(NK)||"관리자")+" (크롬)";edAdmin("add","adm");return;}
  if(b.dataset.rekey){edAdmin("rekey",b.dataset.rekey);return;}
  if(b.dataset.revoke){edAdmin("revoke",b.dataset.revoke);return;}
  if(b.dataset.copy){var cv=b.dataset.copy;(navigator.clipboard?navigator.clipboard.writeText(cv):Promise.reject()).then(function(){edSay("링크를 복사했어요.","ok");},function(){edSay("링크 칸을 선택해 Ctrl+C로 복사하세요.");});return;}
  if(b.dataset.cp){var it=DATA.items[+b.dataset.i],k=b.dataset.k,v=b.dataset.val;if(!Array.isArray(it[k]))it[k]=it[k]&&it[k].length?clone(it[k]):[];var ix=it[k].indexOf(v);if(ix>-1)it[k].splice(ix,1);else it[k].push(v);b.setAttribute("aria-pressed",String(ix<0));dirty();return;}
  if(b.dataset.del!=null){var arr=getP(b.dataset.del),di=+b.dataset.i;if(b.dataset.del==="ships"&&!confirm((arr[di].n||"이 항차")+"를 삭제할까요?"))return;arr.splice(di,1);dirty();if(ED.sec==="it")$("edList").innerHTML=itemList();else{var sc0=$("edB").scrollTop;edBody();$("edB").scrollTop=sc0;}return;}
  if(b.dataset.add){getP(b.dataset.add).push(JSON.parse(b.dataset.blank));dirty();var sc=$("edB").scrollTop;edBody();$("edB").scrollTop=sc;return;}
  if(b.dataset.additem){DATA.items.unshift({t:["sch"],a:"sch",o:"ACE",d:today(),x:"",s:"open",p:[],k:0});ED.q="";ED.fs="";ED.fo="";dirty();edBody();var f=$("edList").querySelector('input[data-k="x"]');if(f)f.focus();return;}
});
window.addEventListener("beforeunload",function(e){if(ED.dirty){e.preventDefault();e.returnValue="";}});
window.ONDASH={load:function(s,sha){SRC=s;SHA=sha||null;parse(SRC);show(SRC);},parse:parse,build:build,data:function(){return DATA;},src:function(){return SRC;}};

(async function(){
  var hm=(location.hash||"").match(/(?:^#|&)edit=([^&]+)/);
  if(hm){lset(KK,decodeURIComponent(hm[1]));curTab="";try{history.replaceState(null,"",location.pathname+location.search);}catch(_){}}
  var src=null;

  if(!src){$("msg").textContent="대시보드를 불러오지 못했어요. 잠시 후 새로고침해 주세요.";return;}

})();
