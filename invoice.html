*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13.5px;-webkit-font-smoothing:antialiased}

.brand{display:flex;align-items:center;gap:10px}

.top .ttl{font-size:19px;font-weight:700;letter-spacing:-.01em}
.top .back{font-size:12.5px;color:var(--teal-text);text-decoration:none;font-weight:700;border:1px solid var(--rule);border-radius:2px;padding:3px 10px;background:var(--panel)}
